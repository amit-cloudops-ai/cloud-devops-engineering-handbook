name: Update README preparation progress
on:
  push:
    branches: [main]
    paths:
      - "progress.json"
      - ".github/scripts/update_preparation_progress.py"
      - ".github/workflows/update-preparation-progress.yml"
permissions:
  contents: write
jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate README progress and ring
        run: python .github/scripts/update_preparation_progress.py
      - name: Commit generated progress
        run: |
          if git diff --quiet; then
            echo "Progress display is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/preparation-progress.svg
          git commit -m "chore: update README preparation progress"
          git push
